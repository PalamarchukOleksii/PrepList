name: preplist
description: "A new Flutter project."
publish_to: 'none'
license: MIT
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  dynamic_color: ^2.1.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  sqflite: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#1E7A4C"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png